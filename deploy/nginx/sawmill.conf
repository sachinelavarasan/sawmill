# TimberTrail — nginx site. Install to /etc/nginx/sites-available/sawmill and
# link it into sites-enabled. Replace mill.example.in with the real address.
# The certificate lines are filled in by: sudo certbot --nginx -d mill.example.in

# 10 login attempts per minute per address (shared by all workers).
limit_req_zone $binary_remote_addr zone=sawmill_login:10m rate=10r/m;

server_tokens off;

# Plain HTTP only redirects to HTTPS (certbot also needs it for renewals).
server {
    listen 80;
    listen [::]:80;
    server_name mill.example.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mill.example.in;

    ssl_certificate     /etc/letsencrypt/live/mill.example.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mill.example.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include snippets/sawmill-app.conf;
}
