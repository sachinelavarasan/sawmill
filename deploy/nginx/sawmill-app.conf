# The web app + API proxy. Included from the HTTPS server block in sawmill.conf.
# Install to /etc/nginx/snippets/ together with sawmill-headers.conf.

root /var/www/sawmill;          # contents of web/dist
index index.html;
client_max_body_size 1m;        # matches the API's own JSON limit

# API: Node listens on 127.0.0.1 only. X-Forwarded-For is *replaced* with the
# real address (not appended), so a client can't fake its IP; the API trusts
# exactly one proxy hop (TRUST_PROXY=1).
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;    # large Excel reports
}

# Login gets its own, stricter limit in front of the API's own (defence in depth).
location = /api/auth/login {
    limit_req zone=sawmill_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Built files have a content hash in their name: cache for a year.
location /assets/ {
    include snippets/sawmill-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# The page itself must never be cached, or users keep running an old release.
location = /index.html {
    include snippets/sawmill-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# Every app route (/imports/…, /reports …) serves the single-page app.
location / {
    include snippets/sawmill-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}
