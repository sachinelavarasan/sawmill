# Security headers for the web app's pages and files.
# Included in each static location: nginx drops server-level add_header lines in any
# location that has its own add_header, so they are repeated per location on purpose.
# (/api responses get their headers from helmet in the API.)

# Only this site's own scripts, styles, fonts and API. 'unsafe-inline' for styles is
# needed by the dialog/scroll-lock components; no inline scripts are allowed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
